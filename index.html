<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pakistani Recipe Selector</title>
<style>
  :root{
    --cream:#FBF3E3;
    --maroon:#7A1F2B;
    --maroon-dark:#5A1620;
    --saffron:#E8A93A;
    --emerald:#0B6E4F;
    --chili:#C1441E;
    --ink:#2B1B12;
    --card-bg:#FFFDF8;
    --shadow: 0 20px 45px rgba(43,27,18,0.18);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(232,169,58,0.18), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(11,110,79,0.14), transparent 50%),
      var(--cream);
    font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;
    color:var(--ink);
    padding-bottom:60px;
  }

  /* ---------- Truck-art stripe divider (signature element) ---------- */
  .stripe-bar{
    height:14px;
    width:100%;
    background:repeating-linear-gradient(
      -45deg,
      var(--chili) 0 18px,
      var(--saffron) 18px 36px,
      var(--emerald) 36px 54px,
      var(--cream) 54px 66px
    );
    background-size:200% 100%;
    animation: shimmerStripe 14s linear infinite;
  }
  @keyframes shimmerStripe{
    from{ background-position:0% 0; }
    to{ background-position:200% 0; }
  }

  /* ---------- Header ---------- */
  header{
    text-align:center;
    padding:44px 20px 34px;
    position:relative;
  }
  .eyebrow{
    display:inline-block;
    font-size:14px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--maroon);
    font-weight:bold;
    margin-bottom:10px;
    position:relative;
  }
  .eyebrow::before, .eyebrow::after{
    content:"◆";
    color:var(--saffron);
    margin:0 10px;
    font-size:10px;
    vertical-align:middle;
  }
  h1{
    font-family:Georgia,'Cambria',serif;
    font-size:clamp(32px,6vw,54px);
    margin:0;
    color:var(--maroon-dark);
    text-shadow: 2px 2px 0 rgba(232,169,58,0.35);
    letter-spacing:1px;
  }
  .urdu{
    font-size:20px;
    color:var(--emerald);
    margin-top:6px;
    font-weight:bold;
    opacity:0.85;
  }
  .tagline{
    max-width:560px;
    margin:16px auto 0;
    font-size:16px;
    line-height:1.5;
    color:#5a4636;
  }

  /* ---------- Selector panel ---------- */
  .selector-wrap{
    max-width:520px;
    margin:38px auto 10px;
    padding:0 20px;
  }
  .selector-panel{
    background:var(--card-bg);
    border:2px solid rgba(122,31,43,0.15);
    border-radius:18px;
    padding:26px 26px 22px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .selector-panel::before{
    content:"";
    position:absolute;
    top:-40px; right:-40px;
    width:120px; height:120px;
    background:radial-gradient(circle, rgba(232,169,58,0.25), transparent 70%);
    border-radius:50%;
  }
  label.select-label{
    display:block;
    font-weight:bold;
    font-size:14px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--maroon);
    margin-bottom:10px;
  }
  .select-shell{
    position:relative;
  }
  select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    background:#fff;
    border:2px solid var(--emerald);
    border-radius:12px;
    padding:14px 44px 14px 16px;
    font-size:16px;
    font-family:inherit;
    color:var(--ink);
    cursor:pointer;
    transition:box-shadow .25s ease, border-color .25s ease, transform .15s ease;
  }
  select:hover{
    border-color:var(--chili);
  }
  select:focus{
    outline:none;
    box-shadow:0 0 0 4px rgba(11,110,79,0.2);
  }
  .select-shell::after{
    content:"▼";
    position:absolute;
    right:16px; top:50%;
    transform:translateY(-50%);
    color:var(--maroon);
    font-size:13px;
    pointer-events:none;
  }
  .result-hint{
    margin-top:12px;
    font-size:14px;
    color:#6b5847;
    min-height:18px;
  }

  /* ---------- Recipe cards ---------- */
  .recipes-wrap{
    max-width:1000px;
    margin:38px auto 0;
    padding:0 20px;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(280px,1fr));
    gap:26px;
  }

  .recipe-card{
    background:var(--card-bg);
    border-radius:20px;
    box-shadow:var(--shadow);
    overflow:hidden;
    opacity:0;
    transform:translateY(24px);
    animation:cardIn .55s ease forwards;
    border:1px solid rgba(122,31,43,0.08);
    display:flex;
    flex-direction:column;
  }
  @keyframes cardIn{
    to{ opacity:1; transform:translateY(0); }
  }

  .card-banner{
    background:linear-gradient(135deg, var(--maroon), var(--maroon-dark));
    padding:24px 22px 20px;
    position:relative;
    overflow:hidden;
  }
  .card-banner .stripe-mini{
    position:absolute; left:0; right:0; bottom:0;
    height:8px;
    background:repeating-linear-gradient(
      -45deg,
      var(--chili) 0 14px,
      var(--saffron) 14px 28px,
      var(--emerald) 28px 42px
    );
  }
  .card-icon{
    font-size:38px;
    display:block;
    margin-bottom:8px;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,0.3));
  }
  .card-banner h2{
    margin:0;
    font-family:Georgia,'Cambria',serif;
    color:var(--cream);
    font-size:23px;
    letter-spacing:0.5px;
  }

  .card-body{
    padding:22px;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .card-body p.desc{
    margin:0 0 16px;
    font-size:15px;
    line-height:1.55;
    color:#4a3a2c;
  }
  .ingredients-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    font-weight:bold;
    color:var(--emerald);
    margin-bottom:10px;
  }
  .ingredient-tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .tag{
    background:#F4E9D6;
    color:var(--maroon-dark);
    font-size:13px;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid rgba(122,31,43,0.15);
    transition:transform .2s ease, background .2s ease;
  }
  .tag.matched{
    background:var(--saffron);
    color:var(--maroon-dark);
    font-weight:bold;
    transform:scale(1.06);
    box-shadow:0 4px 10px rgba(232,169,58,0.45);
  }

  .recipe-card:hover{
    box-shadow:0 26px 55px rgba(43,27,18,0.24);
  }
  .recipe-card{
    transition:box-shadow .3s ease, transform .3s ease;
  }
  .recipe-card:hover{
    transform:translateY(-6px);
  }

  /* ---------- Empty state ---------- */
  .empty-state{
    max-width:600px;
    margin:50px auto 0;
    text-align:center;
    padding:30px 20px;
    color:#7a6650;
    font-size:15px;
  }
  .empty-state span{
    font-size:34px;
    display:block;
    margin-bottom:10px;
  }

  footer{
    text-align:center;
    margin-top:60px;
    font-size:13px;
    color:#8a7660;
  }

  @media (max-width:480px){
    header{padding:34px 16px 26px;}
    .selector-panel{padding:20px 18px 18px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<div class="stripe-bar"></div>

<header>
  <span class="eyebrow">Zaiqa-e-Pakistan</span>
  <h1>Pakistani Recipe Selector</h1>
  <div class="urdu">پاکستانی پکوان</div>
  <p class="tagline">Pick an ingredient from your kitchen and discover which traditional Pakistani dish it belongs to.</p>
</header>

<div class="selector-wrap">
  <div class="selector-panel">
    <label class="select-label" for="ingredientSelect">Choose an ingredient</label>
    <div class="select-shell">
      <select id="ingredientSelect">
        <option value="all">Show all recipes</option>
      </select>
    </div>
    <div class="result-hint" id="resultHint"></div>
  </div>
</div>

<div class="recipes-wrap" id="recipesWrap"></div>
<div class="empty-state" id="emptyState" style="display:none;">
  <span>🍛</span>
  No recipe uses that ingredient yet.
</div>

<div class="stripe-bar" style="margin-top:60px;"></div>
<footer>Made with ghee, spice, and a little bit of truck-art flair.</footer>

<script>
  const recipes = [
    {
      name: "Chicken Biryani",
      icon: "🍚",
      description: "A traditional Pakistani rice dish made with aromatic spices, chicken, and basmati rice.",
      ingredients: ["Chicken","Rice","Yogurt","Onion","Tomato","Biryani Masala","Green Chilies"]
    },
    {
      name: "Beef Nihari",
      icon: "🍲",
      description: "A slow-cooked Pakistani beef curry famous for its rich flavor and spices.",
      ingredients: ["Beef","Flour","Ginger","Garlic","Onion","Nihari Masala","Coriander"]
    },
    {
      name: "Aloo Keema",
      icon: "🥘",
      description: "A popular Pakistani dish made with minced meat, potatoes, and traditional spices.",
      ingredients: ["Minced Meat","Potato","Onion","Tomato","Ginger Garlic Paste","Spices","Green Chilies"]
    }
  ];

  const select = document.getElementById('ingredientSelect');
  const recipesWrap = document.getElementById('recipesWrap');
  const emptyState = document.getElementById('emptyState');
  const resultHint = document.getElementById('resultHint');

  // Build unique, sorted ingredient list for the dropdown
  const allIngredients = Array.from(
    new Set(recipes.flatMap(r => r.ingredients))
  ).sort();

  allIngredients.forEach(ing => {
    const opt = document.createElement('option');
    opt.value = ing;
    opt.textContent = ing;
    select.appendChild(opt);
  });

  function renderCard(recipe, highlightIngredient){
    const card = document.createElement('div');
    card.className = 'recipe-card';

    const tags = recipe.ingredients.map(ing => {
      const isMatch = highlightIngredient && ing === highlightIngredient;
      return `<span class="tag${isMatch ? ' matched' : ''}">${ing}</span>`;
    }).join('');

    card.innerHTML = `
      <div class="card-banner">
        <span class="card-icon">${recipe.icon}</span>
        <h2>${recipe.name}</h2>
        <div class="stripe-mini"></div>
      </div>
      <div class="card-body">
        <p class="desc">${recipe.description}</p>
        <div class="ingredients-label">Ingredients</div>
        <div class="ingredient-tags">${tags}</div>
      </div>
    `;
    return card;
  }

  function render(selectedValue){
    recipesWrap.innerHTML = '';

    let matches;
    let hint;

    if(selectedValue === 'all'){
      matches = recipes;
      hint = `Showing all ${recipes.length} recipes.`;
    } else {
      matches = recipes.filter(r => r.ingredients.includes(selectedValue));
      hint = matches.length
        ? `Found ${matches.length} recipe${matches.length > 1 ? 's' : ''} using "${selectedValue}".`
        : '';
    }

    resultHint.textContent = hint;

    if(matches.length === 0){
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    matches.forEach((recipe, i) => {
      const card = renderCard(recipe, selectedValue === 'all' ? null : selectedValue);
      card.style.animationDelay = (i * 0.12) + 's';
      recipesWrap.appendChild(card);
    });
  }

  select.addEventListener('change', () => render(select.value));

  // initial render
  render('all');
</script>

</body>
</html>
